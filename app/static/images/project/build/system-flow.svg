<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">EcoCraft application request and response flow</title>
  <desc id="desc">Original diagram showing the browser, Flask application, PyMongo driver and MongoDB Atlas in sequence, with requests moving forward and responses returning.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M1 1 9 6 1 11" fill="none" stroke="#1e4b3d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-back" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M1 1 9 6 1 11" fill="none" stroke="#bd714f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1400" height="620" fill="#e9eee6"/>
  <path d="M146 220H1245" stroke="#1e4b3d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1245 465H146" stroke="#bd714f" stroke-width="3" marker-end="url(#arrow-back)"/>
  <text x="690" y="185" text-anchor="middle" fill="#1e4b3d" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">REQUEST</text>
  <text x="690" y="505" text-anchor="middle" fill="#9b5b40" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">RESPONSE</text>
  <g transform="translate(58 245)">
    <rect width="250" height="112" rx="4" fill="#f7f5ef" stroke="#1e4b3d" stroke-width="2"/>
    <path d="M0 26h250" stroke="#1e4b3d" stroke-width="2"/>
    <circle cx="17" cy="13" r="4" fill="#bd714f"/>
    <circle cx="33" cy="13" r="4" fill="#d4b68f"/>
    <circle cx="49" cy="13" r="4" fill="#769172"/>
    <path d="M81 58h87m-87 14h124m-124 14h67" stroke="#c4d2c3" stroke-width="7" stroke-linecap="round"/>
    <text x="125" y="150" text-anchor="middle" fill="#153d30" font-family="Georgia,serif" font-size="25">Browser</text>
    <text x="125" y="174" text-anchor="middle" fill="#677b6f" font-family="Arial,sans-serif" font-size="13">HTML · CSS · JavaScript</text>
  </g>
  <g transform="translate(405 245)">
    <rect width="250" height="112" rx="4" fill="#1e4b3d"/>
    <path d="M30 33h28v48H30zm44 0h46m-46 23h39m-39 25h51" fill="none" stroke="#e6f2e7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="182" cy="56" r="27" fill="#d8e6d8"/>
    <path d="M171 56h22m-11-11v22" stroke="#1e4b3d" stroke-width="4" stroke-linecap="round"/>
    <text x="125" y="150" text-anchor="middle" fill="#153d30" font-family="Georgia,serif" font-size="25">Flask application</text>
    <text x="125" y="174" text-anchor="middle" fill="#677b6f" font-family="Arial,sans-serif" font-size="13">Python · validation · permissions</text>
  </g>
  <g transform="translate(752 245)">
    <rect width="250" height="112" rx="4" fill="#f7f5ef" stroke="#1e4b3d" stroke-width="2"/>
    <path d="M57 37h53v38H57zm53 19h41m-41 15h41m0-31 18 16-18 16" fill="none" stroke="#bd714f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="182" cy="56" r="23" fill="#dbe6d6"/>
    <path d="M170 56h24m-12-12v24" stroke="#1e4b3d" stroke-width="4" stroke-linecap="round"/>
    <text x="125" y="150" text-anchor="middle" fill="#153d30" font-family="Georgia,serif" font-size="25">PyMongo</text>
    <text x="125" y="174" text-anchor="middle" fill="#677b6f" font-family="Arial,sans-serif" font-size="13">Python database driver</text>
  </g>
  <g transform="translate(1099 245)">
    <ellipse cx="125" cy="24" rx="80" ry="22" fill="#bd714f"/>
    <path d="M45 24v68c0 12 36 22 80 22s80-10 80-22V24" fill="#d39a72" stroke="#9a5c43" stroke-width="2"/>
    <path d="M45 47c0 12 36 22 80 22s80-10 80-22m-160 23c0 12 36 22 80 22s80-10 80-22" fill="none" stroke="#9a5c43" stroke-width="2"/>
    <ellipse cx="125" cy="24" rx="80" ry="22" fill="none" stroke="#9a5c43" stroke-width="2"/>
    <text x="125" y="150" text-anchor="middle" fill="#153d30" font-family="Georgia,serif" font-size="25">MongoDB Atlas</text>
    <text x="125" y="174" text-anchor="middle" fill="#677b6f" font-family="Arial,sans-serif" font-size="13">Cloud-hosted database</text>
  </g>
  <text x="700" y="565" text-anchor="middle" fill="#677b6f" font-family="Arial,sans-serif" font-size="15">The application applies its rules; the database stores and returns marketplace information.</text>
</svg>
