<section class="page" id="page-auth" hidden>
  <div class="section-heading">
    <div>
      <p class="kicker">YOUR ECOCRAFT JOURNEY</p>
      <h2>Welcome in</h2>
    </div>
  </div>
  <div class="dual">
    <article class="panel">
      <h3>Sign in</h3>
      <p class="hint">
        Use your registered account or an existing team admin account.
      </p>
      <form id="login-form" class="form">
        <label
          >Email
          <input
            type="email"
            name="email"
            required
            autocomplete="username" /></label
        ><label
          >Password
          <span class="password-input">
            <input
              type="password"
              name="password"
              required
              autocomplete="current-password" />
            <button
              class="password-toggle"
              type="button"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg
                class="eye-icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg
                class="eye-off-icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                hidden
              >
                <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.7 14.7 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4-.8" />
              </svg>
            </button>
          </span></label
        ><button class="primary">Sign in →</button>
      </form>
    </article>
    <article class="panel">
      <h3>Create an account</h3>
      <p class="hint">
        Customers can sign in immediately. New artists require an admin's
        approval.
      </p>
      <form id="register-form" class="form">
        <div class="two">
          <label
            >First name
            <input name="firstName" maxlength="100" required /></label
          ><label
            >Last name <input name="lastName" maxlength="100" required
          /></label>
        </div>
        <label>Email <input type="email" name="email" required /></label
        ><label
          >Password
          <span class="password-input">
            <input
              name="password"
              type="password"
              minlength="10"
              maxlength="128"
              autocomplete="new-password"
              required />
            <button
              class="password-toggle"
              type="button"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg
                class="eye-icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg
                class="eye-off-icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                hidden
              >
                <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.7 14.7 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4-.8" />
              </svg>
            </button>
          </span></label
        ><label
          >Account type<select id="register-role" name="role">
            <option value="customer">Customer</option>
            <option value="artist">Artist</option>
          </select></label
        ><label id="origin-wrap" hidden
          >My maker story<textarea
            name="originStory"
            maxlength="2000"
            rows="3"
            placeholder="Tell us about your sustainable art"
          ></textarea></label
        ><button class="primary">Create account →</button>
      </form>
    </article>
  </div>
</section>
